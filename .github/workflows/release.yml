name: Release

# Tag-driven release. Git tag is the source of truth for SPM consumers.
#
# Developer:
#   1. Set VERSION to X.Y.Z and merge to master
#   2. git tag vX.Y.Z && git push origin vX.Y.Z
#
# Auth: GITHUB_TOKEN only (no personal PAT).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Verify VERSION matches Git tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          EXPECTED="${TAG#v}"
          ACTUAL="$(tr -d '[:space:]' < VERSION)"
          echo "Git tag: ${TAG}"
          echo "Expected VERSION: ${EXPECTED}"
          echo "VERSION file: ${ACTUAL}"
          if [ "${EXPECTED}" != "${ACTUAL}" ]; then
            echo "::error::Tag '${TAG}' does not match VERSION '${ACTUAL}'. Refusing to release."
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag
